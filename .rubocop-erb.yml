inherit_mode:
  merge:
    - Exclude

inherit_from: .rubocop.yml

plugins:
  - rubocop-erb

AllCops:
  Include:
    - "**/*.html.erb"

# ERBではメソッドだけでなくマクロも括弧省略を許さない
# renderやlink_toなどが当てはまる
Style/MethodCallWithArgsParentheses:
  Enabled: true
  IgnoreMacros: false

# rubocop-erbが誤検知するのでオフ
Layout/RedundantLineBreak:
  Enabled: false

# rubocop-erb 0.8からタグをまたいだブロックを解析するが、数えるのはHTMLの行数なのでオフ
Metrics/BlockLength:
  Enabled: false
