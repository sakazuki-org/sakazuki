name: Check

on: [pull_request]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node-lints:
    name: Node Linters
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: "yarn"
      - name: Install Dependencies
        run: yarn install --immutable
      - name: Run ESLint
        run: yarn run lint:eslint
      - name: Run tsc
        run: yarn run lint:tsc
      - name: Run Prettier check
        run: yarn run lint:prettier
      - name: Run Markdownlint
        run: yarn run lint:markdownlint
      - name: Run Stylelint
        run: yarn run lint:stylelint
      - name: Run Markuplint
        run: yarn run lint:markuplint --format GitHub

  ruby-lints:
    name: Ruby Linters
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
        with:
          bundler-cache: true
      - name: Run Rubocop
        run: bundle exec rubocop --format progress --format github
      - name: Run Rubocop ERB
        run: bundle exec rubocop --format progress --format github --config .rubocop-erb.yml
      - name: Run ERB Lint
        run: bundle exec erb_lint --lint-all
      - name: Run Brakeman
        run: bundle exec brakeman --no-pager --format github --run-all-checks

  other-linters:
    name: Other Linters
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: "2026.10.5"

      - name: End of File with Newline
        run: ./cli-scripts/check_endoffile_with_newline.sh

      - name: Run Hadolint
        run: hadolint "$(git ls-files '*Dockerfile*')"

      - name: Run Docker Build Checks
        run: docker build --build-arg RUBY_VERSION="$(cat .ruby-version)" --check .

      - name: Run jactionlint
        run: jactionlint

      - name: Run ghalint
        run: ghalint run

      - name: Run zizmor 🌈
        run: zizmor --offline --persona auditor --collect default -- .
